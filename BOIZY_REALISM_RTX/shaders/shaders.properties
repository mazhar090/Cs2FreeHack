clouds=off

blend.gbuffers_water.colortex3 = off

sliders = shadowMapResolution shadowDistance VL_SAMPLES SSR_SAMPLES CLOUD_QUALITY GI_STRENGTH EXPOSURE BLOOM_STRENGTH SHADOW_SOFTNESS WAVE_SPEED SATURATION CONTRAST SHARPENING DOF_STRENGTH MOTION_BLUR_STRENGTH REFLECTION_STRENGTH MIN_LIGHT CLOUD_DENSITY WATER_ABSORPTION

screen = <profile> <empty> [LIGHTING] [REFLECTIONS] [SHADOWS] [WATER] [SKY] [WEATHER] [MATERIALS] [POST] [PERFORMANCE] *
screen.columns = 2

screen.LIGHTING = VOLUMETRIC_LIGHT VL_SAMPLES RT_GI GI_STRENGTH MIN_LIGHT WARM_BLOCKLIGHT AUTO_EXPOSURE EXPOSURE SSAO
screen.LIGHTING.columns = 2
screen.REFLECTIONS = SSR SSR_SAMPLES ROUGH_REFLECTIONS REFLECTION_STRENGTH
screen.REFLECTIONS.columns = 2
screen.SHADOWS = shadowMapResolution shadowDistance SHADOW_SOFTNESS CONTACT_SHADOWS SSS
screen.SHADOWS.columns = 2
screen.WATER = WATER_WAVES WAVE_SPEED WATER_REFRACTION WATER_CAUSTICS WATER_ABSORPTION WATER_FOAM
screen.WATER.columns = 2
screen.SKY = VOLUMETRIC_CLOUDS CLOUD_QUALITY CLOUD_DENSITY CLOUD_SHADOWS AURORA
screen.SKY.columns = 2
screen.WEATHER = WET_SURFACES PUDDLES RAIN_DROPLETS
screen.WEATHER.columns = 1
screen.MATERIALS = NORMAL_MAPS SPECULAR_MAPS POM
screen.MATERIALS.columns = 1
screen.POST = TAA BLOOM BLOOM_STRENGTH DOF DOF_STRENGTH MOTION_BLUR MOTION_BLUR_STRENGTH CHROMATIC_ABERRATION VIGNETTE SHARPENING TONEMAP SATURATION CONTRAST
screen.POST.columns = 2
screen.PERFORMANCE = ambientOcclusionLevel TAA CONTACT_SHADOWS VOLUMETRIC_LIGHT
screen.PERFORMANCE.columns = 1

